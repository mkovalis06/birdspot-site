<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support — BirdSpot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-900: #0A1A42; --periwinkle: #8C7CF0; --paper: #F6F7FB;
    --ink: #121528; --ink-soft: #4B5074; --line: rgba(255,255,255,0.14); --gold:#F4B400;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', -apple-system, sans-serif; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
  h1, .wordmark { font-family: 'Space Grotesk', sans-serif; font-weight: 600; margin: 0; }
  a { color: var(--periwinkle); text-decoration: none; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 28px; }
  nav { background: var(--navy-900); border-bottom: 1px solid var(--line); }
  nav .wrap { max-width: 1120px; display: flex; align-items: center; justify-content: space-between; height: 68px; }
  .wordmark { color: #fff; font-size: 19px; display: flex; align-items: center; gap: 9px; }
  .wordmark .mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--periwinkle), #5B4FD6); display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .back { color: #C7CDE8; font-size: 14px; }
  main { padding: 90px 0 110px; text-align: center; }
  h1 { font-size: 34px; letter-spacing: -0.01em; }
  p { font-size: 17px; line-height: 1.65; color: var(--ink-soft); margin-top: 16px; }
  .btn {
    display: inline-block; margin-top: 28px; background: var(--gold); color: #2A1C00;
    font-weight: 700; font-size: 15px; padding: 14px 26px; border-radius: 10px;
  }
  footer { background: var(--navy-900); padding: 24px 0; }
  footer .wrap { max-width: 1120px; font-size: 13px; color: #6F76A0; }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="wordmark" href="index.html"><span class="mark">🐦</span>BirdSpot</a>
    <a class="back" href="index.html">← Back to BirdSpot</a>
  </div>
</nav>

<main>
  <div class="wrap">
    <h1>Need a hand?</h1>
    <p>Found a bug, have feedback, or just want to say hi? Email us and we'll get back to you.</p>
    <a class="btn" href="mailto:hello.birdspot@gmail.com">hello.birdspot@gmail.com</a>
  </div>
</main>

<footer><div class="wrap">© 2026 BirdSpot</div></footer>

</body>
</html>
